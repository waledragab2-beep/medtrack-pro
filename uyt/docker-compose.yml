# Production-like stack: PostgreSQL + API (Node) + web (nginx serving the SPA and proxying the API).
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
# Put a TLS-terminating proxy (Caddy / Cloudflare / a load balancer) in front of "web" – Web Push and
# camera access require HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uyt
      POSTGRES_USER: uyt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uyt"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://uyt:${POSTGRES_PASSWORD}@db:5432/uyt
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/uploads
      - ./secrets:/app/secrets:ro

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  db:
  uploads:
