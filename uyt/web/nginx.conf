server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API, realtime and uploads are served by the Node service on the same origin (no CORS needed).
  location /api/      { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 6m; }
  location /uploads/  { proxy_pass http://api:4000; expires 30d; }
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Universal links / App links verification files must be served as JSON.
  location /.well-known/ { default_type application/json; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # SPA routes (/s/:slug, /o/:id, /app/...)
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
